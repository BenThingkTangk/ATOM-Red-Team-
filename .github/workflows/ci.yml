name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  design-system-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: ATOM teal drift guard + design-system tests
        run: npm test
